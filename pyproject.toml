[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "furiusisomount"
version = "0.11.3.1"
description = "Mount ISO, IMG, BIN, MDF and NRG disc images without burning them"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Washington Indacochea Delgado", email = "linuxfrontier@proton.me" },
]
keywords = ["iso", "mount", "disc-image", "fuse", "cd", "dvd"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/wachin/furiusisomount"
Repository = "https://github.com/wachin/furiusisomount.git"
Issues = "https://github.com/wachin/furiusisomount/issues"

[project.scripts]
furiusisomount = "furiusisomount.app:main"

[tool.setuptools.packages.find]
include = ["furiusisomount*"]
