name: build-appimage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ubuntu-keyring

      - name: Install appimage-builder
        run: |
          python3 -m pip install --break-system-packages appimage-builder

      - name: Get version
        id: version
        run: |
          echo "version=$(python3 -c 'import sys; sys.path.insert(0, "."); import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> $GITHUB_OUTPUT

      - name: Create AppImage recipe
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > appimage-builder.yml << 'RECIPE'
          version: 1

          AppDir:
            path: ./FuriusIsoMount.AppDir
            app_info:
              id: io.github.wachin.furiusisomount
              name: FuriusIsoMount
              icon: usr/share/icons/hicolor/128x128/apps/furiusisomount.png
              exec: usr/bin/python3
              exec_args: usr/lib/python3.13/site-packages/furiusisomount/app.py
              version: __APP_VERSION__
            apt:
              arch: amd64
              sources:
                - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ noble main universe'
              include:
                - python3
                - python3-pyqt6
                - fuseiso
                - udisks2
                - bchunk
                - libfuse2
                - libglib2.0-0
              allow_unauthenticated: true
            before_bundle:
              - pip3 install --no-build-isolation --target="usr/lib/python3.13/site-packages/" .
            after_bundle:
              - mkdir -p usr/share/furiusisomount/translations
              - cp translations/furiusisomount_*.qm usr/share/furiusisomount/translations/ 2>/dev/null || true
              - mkdir -p usr/share/applications
              - cp data/furiusisomount.desktop usr/share/applications/
              - mkdir -p usr/share/metainfo
              - cp data/furiusisomount.metainfo.xml usr/share/metainfo/
              - mkdir -p usr/share/icons/hicolor/128x128/apps
              - cp resources/icons/furiusisomount.png usr/share/icons/hicolor/128x128/apps/
          RECIPE
          sed -i "s/__APP_VERSION__/${APP_VERSION}/" appimage-builder.yml
          cat appimage-builder.yml

      - name: Build AppImage
        run: |
          appimage-builder --recipe appimage-builder.yml

      - name: Find and rename AppImage
        run: |
          find . -maxdepth 1 -name "FuriusIsoMount-x86_64.AppImage" -exec mv {} furiusisomount-${{ steps.version.outputs.version }}-x86_64.AppImage \;
          ls -la furiusisomount-*.AppImage

      - name: Compute checksum
        run: |
          sha256sum furiusisomount-*.AppImage | tee sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: furiusisomount-${{ steps.version.outputs.version }}-x86_64.AppImage
          path: |
            furiusisomount-*.AppImage
            sha256.txt

      - name: Publish to GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            furiusisomount-*.AppImage
            sha256.txt
          append_to_existing: true